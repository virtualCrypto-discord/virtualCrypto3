[workspace]
resolver = "2"
members = [
    "crates/vc-core",
    "crates/vc-auth",
    "crates/vc-api",
    "crates/vc-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["tignear"]
repository = "https://github.com/virtualCrypto-discord/virtualCrypto3"

[workspace.dependencies]
# HTTP
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "json",
    "uuid",
    "time",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"

# Time / ids
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Errors / observability
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
vc-core = { path = "crates/vc-core" }
vc-auth = { path = "crates/vc-auth" }
vc-api = { path = "crates/vc-api" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
debug = false

[profile.release]
strip = "debuginfo"
lto = true
codegen-units = 1

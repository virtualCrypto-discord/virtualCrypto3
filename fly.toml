# The application this replaces: the same internal port this server defaults to and
# the same region. No `[env]` — a deploy sets the secrets under the names
# `docs/deploy.md` lists, which are the ones this server reads. The application's
# own secrets are spelled `VCRYPTO_*` and are not read, except for the certificate
# pair, which matches.
app = "virtualcrypto-prod"
primary_region = "phx"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # The same command the current deployment runs, which this image provides as a
  # script over `sqlx migrate run`.
  release_command = "/app/bin/migrate"

[http_service]
  internal_port = 8080
  force_https = true

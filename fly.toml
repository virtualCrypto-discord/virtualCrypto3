# The application this replaces: the same internal port this server defaults to and
# the same region. A deploy sets the secrets under the names
# `docs/deploy.md` lists, which are the ones this server reads. The Elixir read only
# two names from the environment itself (`VCRYPTO_WEBHOOK_PROXY_CERT` and `_KEY`), so
# that pair is one name in both deployments and the rest are this service's.
app = "virtualcrypto-prod"
primary_region = "phx"

[env]
  VCRYPTO_ENV = "production"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # The same command the current deployment runs, which this image provides as a
  # script over `sqlx migrate run`.
  release_command = "/app/bin/migrate"

[http_service]
  internal_port = 8080
  force_https = true

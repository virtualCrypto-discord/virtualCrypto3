name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm --prefix tools/review-workbench run check
      - run: npm --prefix tools/review-workbench test
      - name: Release safety checks
        run: python3 -m unittest discover -s scripts/tests -v

  check:
    runs-on: ubuntu-latest

    env:
      # This runner is disposable and does not persist mbx's cache. Keeping a
      # second copy of build artifacts exhausts its disk while linking tests.
      MBX_DISABLE: "1"
      CARGO_INCREMENTAL: "0"

    services:
      # The same major version the baseline was generated from: `baseline-check`
      # compares a dump of the schema, and pg_dump is fussy about that.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # The toolchain and every tool come from the flake, which is also what a
      # laptop uses, so a difference between them is a difference in the flake.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check
        env:
          PGPASSWORD: postgres
        run: |
          nix develop --command bash -euo pipefail -c '
            just db-create
            just migrate
            just check
          '

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install OAuth browser test dependencies
        run: |
          npm --prefix tools/oauth-browser ci --include=dev
          cd tools/oauth-browser
          npx playwright install --with-deps chromium
      - name: OAuth browser E2E
        env:
          PGPASSWORD: postgres
        run: |
          nix develop --command bash -euo pipefail -c '
            SQLX_OFFLINE=true cargo test -p vc-api --test oauth2_browser -- --ignored --nocapture
          '

      - name: Disk usage
        if: always()
        run: df -h

  # The frontend, as its own job so that a type error and a compile error are both
  # reported in one run rather than one after the other.
  #
  # Through the flake, like the job above, and for the same reason: the toolchain a
  # laptop uses is the toolchain here, so a difference between them is a difference
  # in the flake.
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `npm ci` rather than `npm install`: the lockfile is the input, and an
      # install that resolves something else is a build that is not the one the
      # lockfile describes.
      #
      # `web/.npmrc` carries `include=dev` because this dev shell sets
      # `NODE_ENV=production`, which npm reads as a reason to skip every
      # devDependency — including vite and svelte-check, both of which the two
      # commands below need. npm reports success either way.
      - name: Check and build
        run: |
          nix develop --command bash -euo pipefail -c '
            cd web
            npm ci
            npm run check
            npm test
            npm run build
          '

  deploy-staging:
    name: Deploy staging
    needs: [review-workbench, check, web]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: staging
      url: https://virtualcrypto-staging.fly.dev
    concurrency:
      group: fly-staging
      # Let migrations and Machine updates finish before another deployment.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.97"
      - name: Record current deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'Set FLY_STAGING_API_TOKEN in the staging environment'; exit 1; }
          mkdir -p release-record
          python3 scripts/fly-release.py snapshot --environment staging --directory release-record
      - name: Build once and record digest
        id: image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
        run: |
          tag="git-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          flyctl config validate --config fly.staging.toml --strict
          flyctl deploy --config fly.staging.toml --app virtualcrypto-staging \
            --remote-only --build-only --push --image-label "$tag" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --yes 2>&1 | tee release-record/build.log
          python3 scripts/fly-release.py manifest --directory release-record --log release-record/build.log --tag "$tag"
      - name: Deploy exact image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          flyctl deploy --config fly.staging.toml --app virtualcrypto-staging \
            --image "$RELEASE_IMAGE" --ha=false --deploy-retries 0 --yes 2>&1 | tee release-record/deploy.log
      - name: Smoke and verify deployed digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
        run: |
          python3 scripts/fly-smoke.py https://virtualcrypto-staging.fly.dev | tee release-record/smoke.json
          python3 scripts/fly-release.py verify --environment staging --directory release-record
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          record = json.loads(Path('release-record/release.json').read_text())
          print(f"Staging verified: `{record['source_sha']}`\n\nImage: `{record['image']}`")
          print(f"\nPromote using release workflow with CI run ID `{record['run_id']}`.")
          PY
      - name: Preserve release record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-release-${{ github.run_attempt }}
          path: release-record/
          retention-days: 30
          if-no-files-found: ignore

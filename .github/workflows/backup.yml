name: backup
on:
  push:
    branches: [main]
    paths:
      - 'ops/backup/**'
      - '.github/workflows/backup.yml'
  pull_request:
    paths:
      - 'ops/backup/**'
      - '.github/workflows/backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ops/backup/tests -v
      - run: docker build --provenance=false --tag backup-check ops/backup
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: backup
    concurrency:
      group: fly-backup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.4.97'
      - name: Build backup image
        run: docker build --provenance=false --tag "registry.fly.io/virtualcrypto-backup:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ops/backup
      - name: Push and update the existing daily Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKUP_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          tag="registry.fly.io/virtualcrypto-backup:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          flyctl auth docker
          docker push "$tag"
          image=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          python3 ops/backup/deploy/update.py "$image"
          printf 'Backup image: %s\n\nTakes effect on the next scheduled run.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
